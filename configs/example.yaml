dataset:
  name: DIOR-RSVG
  split: train
  query_manifest: /path/to/queries.jsonl
  image_root: /path/to/images

candidate:
  manifest: /path/to/candidates.jsonl
  top_k: 20

model:
  name: scalar_mlp
  hidden_dim: 64
  dropout: 0.1

training:
  seed: 2026
  batch_size: 32
  learning_rate: 0.0001
  epochs: 20

